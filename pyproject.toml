[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fandb"
dynamic = ["version", "license"]
description = 'PyTorch native distributed training for education.'
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = []
authors = [
  { name = "Chenchao Zhao", email = "35147961+ChenchaoZhao@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "torch > 2.6",
  "transformers >= 5.0.0",
  "accelerate >= 1.12",
  "kernels",
  "torchdata",
  "webdataset",
  "datasets",
  "fire",
  "loguru",
  "mlflow",
  "nvidia-ml-py",          # "pynvml" replacement
  "psutil",
  "omegaconf",
  "tenacity",
  "bitsandbytes",
  "dacite",
]


[project.urls]
Documentation = "https://github.com/Chenchao Zhao/fandb#readme"
Issues = "https://github.com/Chenchao Zhao/fandb/issues"
Source = "https://github.com/Chenchao Zhao/fandb"

[tool.hatch.version]
path = "src/fandb/__about__.py"

# --- DEFAULT ENVIRONMENT ---
[tool.hatch.envs.default]
type = "pip-compile"
pip-compile-hashes = true
pip-compile-resolver = "uv"       # Fast resolution via uv
python = "3.12"
dependencies = ["pytest", "mypy"]

[tool.hatch.envs.default.scripts]
# Use this to refresh all lockfiles at once
update = "hatch-pip-compile --upgrade --all"


# Unified typing command
typing = "mypy --install-types --non-interactive src/fandb tests"

# A clean release flow
release = ["hatch fmt", "typing", "hatch test --all --cover"]

# --- TYPES ENVIRONMENT ---
[tool.hatch.envs.types]
# Inherits everything from default, just adds a specific 'check' command
# No need to re-list dependencies here

[tool.hatch.envs.types.scripts]
check = "typing" # Points back to the definition in default

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes"]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["fandb"]
branch = true
parallel = true
omit = ["src/fandb/__about__.py"]

[tool.coverage.paths]
fandb = ["src/fandb", "*/fandb/src/fandb"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff.lint]
isort.known-first-party = ["fandb"]
exclude = ["./build", ".hatch", "private"]
ignore = [
  "F841",
  "N812",
  "TID252",
  "FBT001",
  "FBT002",
  "ARG002",
  "RUF012",
  "T201",
  "ARG001",
  "TRY003",
  "EM101",
  "RUF009",
  "S107",
  "S311",
  "INP001", # for cli
  "G004",
  "W291",
  "W293",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = [
  "PLR2004",
  "S101",
  "TID252",
  "INP001",
  "PT006",
  "SLF001",
  "PT012",
  "B017",
  "PT011",
  "E712",
]

[tool.hatch.build]
directory = "./build"


[tool.hatch.envs.build-tools]
# This version states what version your build tools build with.
python = "3.12"
detached = true
skip-install = false
dependencies = ["hatch", "hatch-pip-compile"]


[tool.hatch.build.targets.wheel]
packages = ["src/fandb"]

[tool.mypy]
disable_error_code = [
  "import-untyped",
  "assignment",
  "no-redef",
  "arg-type",
  "return-value",
  "attr-defined",
  "override",
  "call-arg",
]
